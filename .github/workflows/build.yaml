name: Build, Test, and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  pull_request_target:
    types: [closed]

jobs:
  determine-version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.gitversion.outputs.fullSemVer }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.0.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion # step id used as reference for output values
        uses: gittools/actions/gitversion/execute@v3.0.0
      
  build:
    runs-on: ubuntu-latest
    needs: determine-version
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: dotnet restore EasyAuthDevProxy.slnx

      - name: Build
        run: dotnet build EasyAuthDevProxy.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test EasyAuthDevProxy.slnx --configuration Release --no-restore --verbosity normal

      - name: Pack Aspire.Hosting.EasyAuthProxy
        run: dotnet pack Aspire.Hosting.EasyAuthProxy --configuration Release --no-restore -p:PackageVersion=${{ env.VERSION }} -o ./nupkg

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkg/*.nupkg
          retention-days: 7

  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: [determine-version, build]
    permissions:
        contents: read
        id-token: write
        packages: write
    env:
        VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Container image
        run: dotnet publish EasyAuthDevProxy -t:PublishContainer -p ContainerRepository="${{ github.actor }}/easyauthdevproxy" -p ContainerImageTags='"${{ needs.determine-version.outputs.version }};latest"' -p ContainerRegistry="ghcr.io"

      - name: Download NuGet package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkg

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet package to nuget.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
