name: Build, Test, and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  determine-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
            fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '5.x'
      - name: Use GitVersion
        id: gitversion # step id used as reference for output values
        uses: gittools/actions/gitversion/execute@26a89e5dd4fa9ba66a853e04706ba52755ca4057 # v3.1.1

      - name: Determine version
        id: version
        # A tag push checks out in detached HEAD, which GitVersion's Mainline mode doesn't
        # resolve back to that tag's own version - it treats the missing branch name as an
        # unknown ref and bumps past it instead. Since a release is triggered BY pushing the
        # tag, the tag itself is the authoritative version; only fall back to GitVersion's
        # computed version for branch/PR builds where there's no tag to read from.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.gitversion.outputs.fullSemVer }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: determine-version
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: dotnet restore EasyAuthDevProxy.slnx --locked-mode

      - name: Build
        run: dotnet build EasyAuthDevProxy.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test EasyAuthDevProxy.slnx --configuration Release --no-restore --verbosity normal

      - name: Build container image (verification only, not pushed)
        # Exercises the same -t:PublishContainer path as the release job's "Build and Push
        # Container image" step, so a broken container build fails CI on the PR instead of
        # only surfacing after merge. Writes to a local archive instead of a registry so it
        # needs no credentials and has no side effects.
        run: dotnet publish EasyAuthDevProxy -t:PublishContainer --configuration Release --no-restore -p:ContainerArchiveOutputPath=./container-verify.tar.gz -p:ContainerRepository=easyauthdevproxy -p:ContainerImageTag=verify

      - name: Pack Alanta.Aspire.Hosting.EasyAuthProxy
        run: dotnet pack Alanta.Aspire.Hosting.EasyAuthProxy --configuration Release --no-restore -p:PackageVersion="$VERSION" -o ./nupkg

      - name: Upload NuGet package artifact
        # Also serves as the preview package for pull requests: GitVersion (Mainline mode)
        # assigns PR builds a prerelease version, and reviewers can download this artifact
        # to try the package locally. Not published to any feed - see the release job for that.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-packages
          path: ./nupkg/*.nupkg
          retention-days: 7

  release:
    # Only a pushed vX.Y.Z tag cuts a release - regular pushes to main no longer auto-publish,
    # so tags/Releases/published packages stay in lockstep (see repo discussion history).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [determine-version, build]
    permissions:
        contents: write
        id-token: write
        packages: write
    env:
        VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download NuGet package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nuget-packages
          path: ./nupkg

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Deviation from SECURITY_GUIDELINES.md 1.4 (never pass a secret as a command-line
      # argument): `dotnet nuget push` only accepts --api-key on the command line, per
      # Microsoft's own trusted-publishing example (learn.microsoft.com/nuget/nuget-org/
      # trusted-publishing). Risk is limited: this is nuget.org's short-lived (1h) trusted
      # publishing key, scoped to this push, on a single ephemeral GitHub-hosted runner.
      - name: Push NuGet package to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Determine previous release tag
        id: prevtag
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n1 || true)
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Check for proxy changes since previous release
        id: proxychanges
        run: |
          PREV_TAG="${{ steps.prevtag.outputs.tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found - treating as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PREV_TAG" HEAD -- EasyAuthDevProxy Directory.Build.props Directory.Packages.props; then
            echo "No changes to the proxy since $PREV_TAG - skipping container publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Proxy changed since $PREV_TAG."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.proxychanges.outputs.changed == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build and Push Container image
        if: steps.proxychanges.outputs.changed == 'true'
        env:
          ACTOR: ${{ github.actor }}
        run: dotnet publish EasyAuthDevProxy -t:PublishContainer -p ContainerRepository="$ACTOR/easyauthdevproxy" -p ContainerImageTags="\"$VERSION;latest\"" -p ContainerRegistry="ghcr.io"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./nupkg/*.nupkg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
