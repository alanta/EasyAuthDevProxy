version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      # One PR per run rather than one per action - these bumps are routine and
      # reviewing them together is no harder than reviewing them separately.
      github-actions:
        patterns:
          - "*"
    ignore:
      # The GitTools actions are pinned to a major deliberately: the workflow requests
      # GitVersion via `versionSpec: '5.x'`, and GitVersion.yml is written against 5.x
      # config (`mode: Mainline`). Moving to the next action major means migrating the
      # tool and its config together, which is a deliberate change rather than something
      # to accept from a grouped bump. Minor and patch updates still come through.
      - dependency-name: "gittools/actions/*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Split by update type so a major bump - notably Aspire.Hosting, whose certificate
      # APIs this package calls while they're still marked experimental - arrives as its
      # own reviewable PR instead of buried among routine minor/patch updates.
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
      nuget-major:
        update-types:
          - "major"
